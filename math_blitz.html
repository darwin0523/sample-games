<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Math Blitz</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap');

  :root {
    --bg: #0b1220;
    --panel: #121b2e;
    --line: #24314d;
    --ink: #e7edf7;
    --dim: #7d8bab;
    --accent: #7CFF6B;
    --accent-dim: #3f6b3a;
    --bad: #ff5d5d;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Space Grotesk', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .cabinet {
    width: 420px;
    max-width: 92vw;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 28px 26px 22px;
    box-shadow: 0 30px 60px -30px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.02);
  }

  .top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 18px;
  }

  .brand {
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--dim);
  }

  .brand span { color: var(--accent); }

  .stats {
    display: flex;
    gap: 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
  }

  .stat { text-align: right; }
  .stat b { display: block; font-size: 18px; color: var(--ink); }
  .stat small { color: var(--dim); font-weight: 500; }

  .timebar {
    height: 6px;
    width: 100%;
    background: var(--line);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 26px;
  }
  .timebar > div {
    height: 100%;
    width: 100%;
    background: var(--accent);
    transform-origin: left;
    transition: width 0.05s linear, background 0.2s;
  }

  .stage {
    text-align: center;
    padding: 18px 0 8px;
  }

  #equation {
    font-family: 'JetBrains Mono', monospace;
    font-size: 46px;
    font-weight: 700;
    letter-spacing: 0.02em;
    min-height: 58px;
  }

  #equation .op { color: var(--accent); }

  form {
    display: flex;
    gap: 10px;
    margin-top: 22px;
  }

  #answer {
    flex: 1;
    background: #0e1626;
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--ink);
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    text-align: center;
    padding: 12px 10px;
    outline: none;
  }
  #answer:focus { border-color: var(--accent); }

  button {
    background: var(--accent);
    border: none;
    border-radius: 10px;
    color: #0b1220;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 15px;
    padding: 0 20px;
    cursor: pointer;
  }
  button:active { transform: translateY(1px); }

  .feedback {
    text-align: center;
    height: 18px;
    margin-top: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--dim);
  }

  .flash-good { color: var(--accent) !important; }
  .flash-bad { color: var(--bad) !important; }

  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(11,18,32,0.94);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    border-radius: 18px;
    text-align: center;
    padding: 20px;
  }
  .hidden { display: none; }

  .overlay h1 {
    font-size: 22px;
    margin: 0;
    letter-spacing: 0.04em;
  }
  .overlay .final {
    font-family: 'JetBrains Mono', monospace;
    font-size: 44px;
    font-weight: 700;
    color: var(--accent);
  }
  .overlay p { color: var(--dim); margin: 0; font-size: 13px; }

  .wrap { position: relative; }
</style>
</head>
<body>

<div class="wrap">
  <div class="cabinet">
    <div class="top">
      <div class="brand">Math <span>Blitz</span></div>
      <div class="stats">
        <div class="stat"><b id="score">0</b><small>score</small></div>
        <div class="stat"><b id="streak">0</b><small>streak</small></div>
      </div>
    </div>

    <div class="timebar"><div id="timeFill"></div></div>

    <div class="stage">
      <div id="equation">60</div>
    </div>

    <form id="form" autocomplete="off">
      <input id="answer" type="number" inputmode="numeric" placeholder="?" />
      <button type="submit">Go</button>
    </form>

    <div class="feedback" id="feedback">Answer as many as you can before time runs out.</div>
  </div>

  <div class="overlay hidden" id="startOverlay">
    <div class="brand">Math <span>Blitz</span></div>
    <p>60 seconds. Quick arithmetic. Chain correct answers for streak bonuses.</p>
    <button id="startBtn">Start</button>
  </div>

  <div class="overlay hidden" id="endOverlay">
    <h1>Time's up</h1>
    <div class="final" id="finalScore">0</div>
    <p id="endDetail"></p>
    <button id="againBtn">Play again</button>
  </div>
</div>

<script>
  const equationEl = document.getElementById('equation');
  const answerEl = document.getElementById('answer');
  const scoreEl = document.getElementById('score');
  const streakEl = document.getElementById('streak');
  const feedbackEl = document.getElementById('feedback');
  const timeFill = document.getElementById('timeFill');
  const form = document.getElementById('form');
  const startOverlay = document.getElementById('startOverlay');
  const endOverlay = document.getElementById('endOverlay');
  const startBtn = document.getElementById('startBtn');
  const againBtn = document.getElementById('againBtn');
  const finalScoreEl = document.getElementById('finalScore');
  const endDetail = document.getElementById('endDetail');

  const DURATION = 60;
  let timeLeft, score, streak, correctAnswer, running, best, timerId;

  best = Number(localStorage.getItem('mathBlitzBest') || 0);

  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function newEquation() {
    const ops = ['+', '-', '×'];
    const op = ops[randInt(0, streak >= 6 ? 2 : 1)];
    let a, b, answer;

    if (op === '+') {
      a = randInt(2, 50); b = randInt(2, 50);
      answer = a + b;
    } else if (op === '-') {
      a = randInt(5, 60); b = randInt(2, a);
      answer = a - b;
    } else {
      a = randInt(2, 12); b = randInt(2, 12);
      answer = a * b;
    }

    correctAnswer = answer;
    equationEl.innerHTML = `${a} <span class="op">${op}</span> ${b}`;
  }

  function setFeedback(text, cls) {
    feedbackEl.textContent = text;
    feedbackEl.className = 'feedback' + (cls ? ' ' + cls : '');
  }

  function updateStats() {
    scoreEl.textContent = score;
    streakEl.textContent = streak;
  }

  function startGame() {
    startOverlay.classList.add('hidden');
    endOverlay.classList.add('hidden');
    score = 0; streak = 0; timeLeft = DURATION; running = true;
    updateStats();
    setFeedback('Answer as many as you can before time runs out.');
    newEquation();
    answerEl.value = '';
    answerEl.focus();
    timeFill.style.background = 'var(--accent)';
    tick();
    timerId = setInterval(tick, 100);
  }

  function tick() {
    timeLeft -= 0.1;
    if (timeLeft <= 0) {
      timeLeft = 0;
      endGame();
    }
    const pct = (timeLeft / DURATION) * 100;
    timeFill.style.width = pct + '%';
    if (pct < 25) timeFill.style.background = 'var(--bad)';
  }

  function endGame() {
    running = false;
    clearInterval(timerId);
    if (score > best) {
      best = score;
      localStorage.setItem('mathBlitzBest', best);
      endDetail.textContent = 'New best score!';
    } else {
      endDetail.textContent = `Best: ${best}`;
    }
    finalScoreEl.textContent = score;
    endOverlay.classList.remove('hidden');
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (!running) return;
    const val = Number(answerEl.value);
    if (answerEl.value.trim() === '') return;

    if (val === correctAnswer) {
      streak += 1;
      const bonus = 10 + Math.min(streak, 10) * 2;
      score += bonus;
      setFeedback(`+${bonus} · streak ${streak}`, 'flash-good');
    } else {
      streak = 0;
      setFeedback(`Nope — it was ${correctAnswer}`, 'flash-bad');
    }
    updateStats();
    answerEl.value = '';
    newEquation();
  });

  startBtn.addEventListener('click', startGame);
  againBtn.addEventListener('click', startGame);

  // Show start overlay initially
  startOverlay.classList.remove('hidden');
</script>

</body>
</html>
